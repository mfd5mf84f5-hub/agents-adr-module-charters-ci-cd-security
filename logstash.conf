# Logstash configuration for JSON log ingestion

input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse JSON
  json {
    source => "message"
  }
  
  # Extract timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "schema-architect-%{+YYYY.MM.dd}"
  }
}
