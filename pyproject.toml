[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-a-ontology-schema-architect"
version = "0.1.0"
description = "AI-driven ontology and schema architecture framework"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Agent A Team", email = "team@example.com" }
]
keywords = ["ontology", "schema", "architecture", "agent", "governance"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastapi>=0.95.0,<1.0.0",
    "uvicorn[standard]>=0.20.0,<1.0.0",
    "jsonschema>=4.18.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "feast>=0.31.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "flake8>=6.0.0,<7.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.4.0,<2.0.0",
    "pre-commit>=3.3.0,<4.0.0",
]

security = [
    "cryptography>=41.0.0,<42.0.0",
    "hvac>=1.2.0,<2.0.0",
]

sbom = [
    "cyclonedx-bom>=3.7.0,<4.0.0",
]

[project.urls]
Repository = "https://github.com/agent-a/ontology-schema-architect"
Documentation = "https://agent-a.readthedocs.io"
"Issue Tracker" = "https://github.com/agent-a/ontology-schema-architect/issues"

[tool.setuptools]
packages = ["agent_a", "feature_engineering"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | _build
  | feast_repo
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests for schema validation",
    "slow: Slow tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["agent_a", "feature_engineering"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 75
precision = 2

[tool.coverage.html]
directory = "htmlcov"