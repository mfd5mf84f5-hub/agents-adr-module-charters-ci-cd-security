name: Performance Regression Detection

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/benchmarks/**'
      - '.github/workflows/benchmark.yml'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-benchmark

      - name: Run benchmarks (current branch)
        run: |
          pytest tests/benchmarks/ -v \
            --benchmark-only \
            --benchmark-json=.benchmarks/current.json
        continue-on-error: true

      - name: Checkout main for baseline
        run: |
          git fetch origin main:main

      - name: Run benchmarks (main baseline)
        run: |
          git stash
          git checkout main
          pytest tests/benchmarks/ -v \
            --benchmark-only \
            --benchmark-json=.benchmarks/baseline.json
          git checkout -
          git stash pop
        continue-on-error: true

      - name: Compare benchmarks
        run: |
          python scripts/compare_benchmarks.py \
            .benchmarks/baseline.json \
            .benchmarks/current.json
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: .benchmarks/

      - name: Comment on PR
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.benchmarks/comparison.json', 'utf8'));
            
            let comment = '## Performance Benchmark Results\n\n';
            let hasRegression = false;
            
            for (const [name, result] of Object.entries(results)) {
              const pctChange = ((result.current - result.baseline) / result.baseline * 100).toFixed(2);
              const status = Math.abs(pctChange) > 10 ? '⚠️' : '✅';
              
              if (Math.abs(pctChange) > 10) hasRegression = true;
              
              comment += `${status} ${name}: ${pctChange}%\n`;
            }
            
            if (hasRegression) {
              comment += '\n⚠️ **Performance regressions detected (>10%)**';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
